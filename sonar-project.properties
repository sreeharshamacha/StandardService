# Required metadata
sonar.projectKey=StandardService
sonar.projectName=StandardService
sonar.projectVersion=0.0.1-SNAPSHOT

# Comma-separated paths to directories with sources (required)
sonar.sources=src/main/java

# Comma-separated paths to directories with tests
sonar.tests=src/test/java

# Path to the execution bytecode/binaries
sonar.java.binaries=target/classes

# Path to the Jacoco test coverage XML report generated by jacoco-maven-plugin
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Language
sonar.language=java

# Encoding of the source code
sonar.sourceEncoding=UTF-8
