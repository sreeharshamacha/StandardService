spring:
  application:
    name: StandardService
  
  datasource:
    url: jdbc:h2:mem:standard_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:password}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      enabled: true
      path: /h2-console

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/standard
      client:
        registration:
          standard-client:
            client-id: standard-service
            client-secret: secret
            authorization-grant-type: client_credentials
            scope: read,write
        provider:
          standard-client:
            token-uri: http://localhost:8081/auth/realms/standard/protocol/openid-connect/token

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  
  tracing:
    sampling:
      probability: 1.0
  
  prometheus:
    metrics:
      export:
        enabled: true

# Resilience4j Config
resilience4j:
  circuitbreaker:
    instances:
      mainService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5000
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  ratelimiter:
    instances:
      mainService:
        registerHealthIndicator: false
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

# Swagger Config
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

logging:
  config: classpath:log4j2.xml
